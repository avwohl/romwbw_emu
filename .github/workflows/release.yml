name: Build and Release Packages

# On pinning: this workflow pins none of what it installs - not fpm, not
# emscripten, not the cpmemu clone that supplies the Z80 core.  That is a
# decision, not an oversight, and it was made after the alternative had been
# tried: EMSDK_VERSION, UM80_VERSION and CPMEMU_REF all existed here and were
# removed.
#
# The argument for pinning is that a dependency can change what ships with
# nothing in this repository touched.  True, and it has happened - 13d1c23 for
# emcc, and a cpmemu makefile change that broke the GCC build of libqkz80.a.
# The argument against is that pins rot silently: they stop collecting fixes,
# the bump becomes a cliff, and only one person can do it.  They also promise
# more than they deliver here, because ubuntu-latest, every apt package and the
# emsdk tooling repo all float regardless - a pinned fpm under a moving OS is
# not a reproducible build, just a partial one.
#
# What replaces the pins is running this workflow before it matters.  It is
# workflow_dispatch-able, the upload step and the collect job are both gated on
# the release event, so a dispatch builds everything and publishes nothing:
#
#     gh workflow run release.yml --ref main -f version=X.Y
#
# Do that before tagging.  A dependency that moved under you then costs one red
# run instead of a broken release, which is the failure the pins existed to
# prevent.  Use a plain version with no hyphen: rpm rewrites '-' and the
# version-less copy step below matches fpm's filename literally.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
        default: '0.0.1'

permissions:
  contents: write

jobs:
  build:
    strategy:
      # The two arches are independent builds that upload their own assets, so
      # one failing must not cancel the other.  GitHub's default is fail-fast:
      # true, and it has already cost a release here - run 31176917009: the
      # arm64 job failed, amd64 was cancelled mid-build, `collect` was skipped,
      # and the release ended up with NO assets on either arch rather than the
      # four that were about to succeed.  Recovering that took a force-moved
      # tag (v1.35's headSha went 6f4bc554 -> 13d1c239), which is exactly the
      # thing docs/RELEASE_ORDER_2026-08-25.md says not to do to a published
      # tag.  With this set, a half-failed release keeps the good arch's four
      # assets and `gh run rerun --failed` completes the set in place.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            rpm_arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            rpm_arch: aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ruby ruby-dev rubygems rpm
          # Deliberately unpinned, like everything else this workflow installs.
          # See "On pinning" at the top of this file.
          sudo gem install fpm
          #
          # There is deliberately no um80 here, and no python3-pip to install it
          # with.  um80 used to be installed "for 8080/Z80" and was never
          # invoked: this workflow assembles nothing, runs no tests, and builds
          # r8.com/w8.com from no target - those are checked against their
          # sources by `make -C src test`, which only test.yml runs.  Installing
          # a tool this job never invokes could only ever break a release, never
          # help one.  emsdk needs python3, which the runner already has; it
          # does not need pip.
          #
          # Install emscripten for WebAssembly build.  Unpinned - see "On
          # pinning" at the top of this file.  This is the install with the
          # worst feedback loop of the three: nothing in this repository builds
          # the wasm, so an emcc regression can only ever appear here, and only
          # when a release is being cut.  It has happened once, at 13d1c23 -
          # emcc stopped implying the C++ driver at link time, web/makefile's
          # link came out with operator new undefined, and the web build failed
          # on a commit that had not touched it.  Run this workflow with
          # workflow_dispatch before tagging and that is a caught problem
          # instead of a broken release.
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build qkz80 library
        run: |
          # cpmemu's default branch, not a pinned ref - see "On pinning" at
          # the top of this file.  This clone is the Z80 core the released
          # binary contains, so what ships is whatever cpmemu's main looked
          # like when the release was cut.  That is the accepted trade: the
          # core is one project by one author, its releases are deliberate, and
          # `make -C src test` in test.yml builds against the same floating
          # clone on every push here - so a cpmemu change that breaks this
          # repository shows up on the next commit rather than at tag time.
          #
          # Worth knowing when reading a release note: most cpmemu releases
          # change nothing here.  Only the four qkz80 sources reach this binary
          # via libqkz80.a; cpmemu.cc and os/*/platform.cc are its own app and
          # are never compiled by this repository.  `git diff <a>..<b> --
          # 'src/qkz80*'` is the check for whether a bump touched the core at
          # all.  Across the last two refs this repository pinned,
          # 9a94e8d..91151f1, it returned qkz80.pc.in alone - pkg-config
          # metadata nothing here reads - and libqkz80.a came out byte-identical
          # (118976 bytes, md5 374bde15a856cef17b89388c6576ff2f).  Do not read
          # that as "cpmemu releases never touch the core": over the wider
          # v4.6.0..v4.7.2 the same command returns five files.  Run it.
          git clone https://github.com/avwohl/cpmemu.git
          cd cpmemu/src
          make libqkz80.a

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build romwbw_emu
        run: |
          cd src
          make clean || true
          make STATIC=1 QKZ80_CFLAGS="-I../cpmemu/src" QKZ80_LIBS="-L../cpmemu/src -lqkz80"

      - name: Build web version
        run: |
          source emsdk/emsdk_env.sh
          cd web
          make clean || true
          make QKZ80_SRC=../cpmemu/src
          # Render the page from its template. Only romwbw.html-template is
          # checked in; nothing else creates romwbw.html, so the packaging
          # step below used to copy a file that never existed and - because
          # its errors were discarded - shipped a web/ directory containing
          # the wasm and no page to load it.
          sed "s/@VERSION@/${{ steps.version.outputs.version }}/" \
            romwbw.html-template > romwbw.html

      - name: Create staging directory
        run: |
          mkdir -p staging/usr/bin
          mkdir -p staging/usr/share/doc/romwbw_emu
          mkdir -p staging/usr/share/romwbw_emu/web
          mkdir -p staging/usr/share/romwbw_emu/web/vendor
          cp src/romwbw_emu staging/usr/bin/
          # The catalog client. It is the only way to get a ROM now, so it is
          # a first-class part of the package rather than a developer script:
          # `romwbw_emu` with no argument tells the user to run `romwbw-get`,
          # and that has to be on their PATH when it does.
          install -m 755 tools/romwbw-get staging/usr/bin/romwbw-get
          # No 2>/dev/null || true here: every one of these is checked in or
          # built above, so a failure means the package would ship incomplete.
          # Discarding that error is what hid the missing page for this long.
          cp web/romwbw.html web/romwbw.js web/romwbw.wasm staging/usr/share/romwbw_emu/web/
          # xterm is vendored under web/vendor/ rather than pulled from a
          # CDN, so it has to be staged too. Without this an installed deb
          # on a machine with no internet opens a page with no terminal in
          # it: the emulator runs and nothing can be seen or typed.
          cp web/vendor/xterm.css web/vendor/xterm.js web/vendor/xterm-addon-fit.js \
             web/vendor/LICENSE.xterm web/vendor/LICENSE.xterm-addon-fit \
             staging/usr/share/romwbw_emu/web/vendor/
          # NO ROM IS STAGED. Every .deb and .rpm up to v1.39 carried six
          # 512 KB ROMs in usr/share/romwbw_emu/roms plus a seventh copy of
          # emu_avw.rom beside the page - about 3.7 MB of a package whose
          # binary is 400 KB - and shipping them is what made "publish a new
          # ROM" mean "release this repository". They come from the catalog
          # now, and DECISIONS.md section 4 asked exactly this question.
          #
          # What that means for the installed page: it has no ROM and no disk
          # until somebody populates the mirror beside it, and it says so in
          # its own status line and terminal rather than 404ing on names
          # nobody chose (which is what it did before this - the two disks its
          # select offered by default were never staged by anything). One
          # command fixes it:
          #
          #     romwbw-get mirror /usr/share/romwbw_emu/web
          #
          # The file pickers work with no mirror at all.
          cp README.md staging/usr/share/doc/romwbw_emu/
          cp LICENSE staging/usr/share/doc/romwbw_emu/
          cp docs/CATALOG.md staging/usr/share/doc/romwbw_emu/

      - name: No artifact slipped into the package
        run: |
          # The staging step above is the last place a ROM could get back into
          # something users install. Assert rather than trust: the two cp lines
          # that used to put them there were unguarded on purpose, so their
          # removal is the kind of change a later edit could quietly undo.
          found=$(find staging -type f \( -name '*.rom' -o -name '*.img' \) || true)
          if [ -n "$found" ]; then
            echo "a ROM or disk image reached the package staging area:"
            echo "$found"
            exit 1
          fi
          test -x staging/usr/bin/romwbw-get || {
            echo "romwbw-get is not in the package - the emulator's own error"
            echo "message tells users to run it"
            exit 1
          }
          echo "no .rom or .img staged; romwbw-get is installed"

      - name: Build DEB package
        run: |
          fpm -s dir -t deb \
            -n romwbw-emu \
            -v ${{ steps.version.outputs.version }} \
            -a ${{ matrix.arch }} \
            --description "RomWBW hardware emulator with HBIOS" \
            --url "https://github.com/${{ github.repository }}" \
            --license "GPL-3.0" \
            --maintainer "Aaron Wohl" \
            -C staging \
            .

      - name: Build RPM package
        run: |
          fpm -s dir -t rpm \
            -n romwbw-emu \
            -v ${{ steps.version.outputs.version }} \
            -a ${{ matrix.rpm_arch }} \
            --description "RomWBW hardware emulator with HBIOS" \
            --url "https://github.com/${{ github.repository }}" \
            --license "GPL-3.0" \
            --maintainer "Aaron Wohl" \
            -C staging \
            .

      - name: Create version-less copies for latest download
        run: |
          # Create version-less copies so /releases/latest/download/ URLs work
          cp romwbw-emu_${{ steps.version.outputs.version }}_${{ matrix.arch }}.deb romwbw-emu_${{ matrix.arch }}.deb
          cp romwbw-emu-${{ steps.version.outputs.version }}-1.${{ matrix.rpm_arch }}.rpm romwbw-emu.${{ matrix.rpm_arch }}.rpm

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: "*.deb"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.rpm_arch }}
          path: "*.rpm"

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.deb
            *.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  collect:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: List packages
        run: |
          echo "Built packages:"
          find packages -type f \( -name "*.deb" -o -name "*.rpm" \) | sort
