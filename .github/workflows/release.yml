name: Build and Release Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
        default: '0.0.1'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            rpm_arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            rpm_arch: aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ruby ruby-dev rubygems rpm python3-pip
          sudo gem install fpm
          # Install um80 assembler for 8080/Z80
          pip install um80
          # Install emscripten for WebAssembly build.
          #
          # Pinned, for the reason CPMEMU_REF below is pinned and test.yml pins
          # UM80_VERSION: `install latest` makes every release depend on
          # whatever emscripten shipped that morning, and it has already broken
          # one. 13d1c23: emcc stopped implying the C++ driver at link time, so
          # web/makefile's link came out with operator new undefined and the
          # web build failed on a commit that had not touched it. Nothing in
          # this repository builds the wasm - emcc is not a build dependency
          # here - so CI is the only place that failure can appear, which makes
          # the pin worth more here than anywhere else.
          #
          # 6.0.8 is what `latest` resolves to as this is written, so the pin
          # changes nothing about what the next release builds with; it only
          # stops the answer moving on its own. Bump it deliberately, and
          # expect to rebuild the web page when you do.
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install ${EMSDK_VERSION}
          ./emsdk activate ${EMSDK_VERSION}
        env:
          EMSDK_VERSION: 6.0.8

      - name: Build qkz80 library
        run: |
          # Pinned, not default-branch HEAD. This clone is the Z80 core the
          # released binary contains, so an unpinned one makes every release
          # depend on whatever cpmemu happened to look like that morning - a
          # commit in another repo could change or break a release here with
          # nobody touching this one. Bump deliberately, the way the RomWBW pin
          # is bumped.
          git clone https://github.com/avwohl/cpmemu.git
          cd cpmemu
          git checkout --detach ${CPMEMU_REF}
          cd src
          make libqkz80.a
        env:
          CPMEMU_REF: 9a94e8d

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build romwbw_emu
        run: |
          cd src
          make clean || true
          make STATIC=1 QKZ80_CFLAGS="-I../cpmemu/src" QKZ80_LIBS="-L../cpmemu/src -lqkz80"

      - name: Build web version
        run: |
          source emsdk/emsdk_env.sh
          cd web
          make clean || true
          make QKZ80_SRC=../cpmemu/src
          # Render the page from its template. Only romwbw.html-template is
          # checked in; nothing else creates romwbw.html, so the packaging
          # step below used to copy a file that never existed and - because
          # its errors were discarded - shipped a web/ directory containing
          # the wasm and no page to load it.
          sed "s/@VERSION@/${{ steps.version.outputs.version }}/" \
            romwbw.html-template > romwbw.html

      - name: Create staging directory
        run: |
          mkdir -p staging/usr/bin
          mkdir -p staging/usr/share/doc/romwbw_emu
          mkdir -p staging/usr/share/romwbw_emu/web
          mkdir -p staging/usr/share/romwbw_emu/web/vendor
          mkdir -p staging/usr/share/romwbw_emu/roms
          cp src/romwbw_emu staging/usr/bin/
          # No 2>/dev/null || true here: every one of these is checked in or
          # built above, so a failure means the package would ship incomplete.
          # Discarding that error is what hid the missing page for this long.
          cp web/romwbw.html web/romwbw.js web/romwbw.wasm staging/usr/share/romwbw_emu/web/
          # xterm is vendored under web/vendor/ rather than pulled from a
          # CDN, so it has to be staged too. Without this an installed deb
          # on a machine with no internet opens a page with no terminal in
          # it: the emulator runs and nothing can be seen or typed.
          cp web/vendor/xterm.css web/vendor/xterm.js web/vendor/xterm-addon-fit.js \
             web/vendor/LICENSE.xterm web/vendor/LICENSE.xterm-addon-fit \
             staging/usr/share/romwbw_emu/web/vendor/
          cp roms/*.rom staging/usr/share/romwbw_emu/roms/
          # The page fetches its ROM by a bare relative name -
          # fetchWithProgress('emu_avw.rom') in romwbw.html-template - so it
          # resolves next to the page, not in roms/. Staging roms/ alone left
          # the installed page 404ing on the only ROM its select offers.
          # Measured by serving a copy of this staging layout and fetching
          # every href/src in the rendered page.
          cp roms/emu_avw.rom staging/usr/share/romwbw_emu/web/
          cp README.md staging/usr/share/doc/romwbw_emu/
          cp LICENSE staging/usr/share/doc/romwbw_emu/

      - name: Build DEB package
        run: |
          fpm -s dir -t deb \
            -n romwbw-emu \
            -v ${{ steps.version.outputs.version }} \
            -a ${{ matrix.arch }} \
            --description "RomWBW hardware emulator with HBIOS" \
            --url "https://github.com/${{ github.repository }}" \
            --license "GPL-3.0" \
            --maintainer "Aaron Wohl" \
            -C staging \
            .

      - name: Build RPM package
        run: |
          fpm -s dir -t rpm \
            -n romwbw-emu \
            -v ${{ steps.version.outputs.version }} \
            -a ${{ matrix.rpm_arch }} \
            --description "RomWBW hardware emulator with HBIOS" \
            --url "https://github.com/${{ github.repository }}" \
            --license "GPL-3.0" \
            --maintainer "Aaron Wohl" \
            -C staging \
            .

      - name: Create version-less copies for latest download
        run: |
          # Create version-less copies so /releases/latest/download/ URLs work
          cp romwbw-emu_${{ steps.version.outputs.version }}_${{ matrix.arch }}.deb romwbw-emu_${{ matrix.arch }}.deb
          cp romwbw-emu-${{ steps.version.outputs.version }}-1.${{ matrix.rpm_arch }}.rpm romwbw-emu.${{ matrix.rpm_arch }}.rpm

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: "*.deb"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.rpm_arch }}
          path: "*.rpm"

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.deb
            *.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  collect:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: List packages
        run: |
          echo "Built packages:"
          find packages -type f \( -name "*.deb" -o -name "*.rpm" \) | sort
