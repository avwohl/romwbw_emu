name: Tests

# Nothing but a person ran the test suite before this. .github/workflows held
# only release.yml, which builds and packages and has no test step, so a change
# that broke the console, the HBIOS dispatcher or the disk-resident utilities
# was caught only if whoever made it thought to type `make -C src test`.
#
# `make -C src test` needs no ROM, no disk image and no network. It runs:
#   tests/vda_keyboard.cc        HBIOS VDA keyboard behaviour
#   tests/hbios_hostname.cc      HBF_HOST_GETNAME and its buffer bound
#   tests/cli_console.cc         the console on a real pipe and a real pty
#   tests/cli_hostfile.cc        where W8 writes, and what it reports back
#   tests/web_reload_disks.js    page JS, driven headless by node
#   tests/web_console_output.js  page JS, driven headless by node
#   disks/verify_disk_utils.sh   the R8/W8 in the tracked images vs their source
#
# The last one is the reason cpmtools is installed below. It SKIPS silently
# when um80, ul80 or cpmcp are missing - which is right on a developer's
# machine and wrong here, where a skip would report a green disk check that
# never opened an image. The step after the suite asserts it actually ran.
#
# Three jobs, and only the first one runs the suite:
#
#   test    ubuntu-latest, the whole of `make -C src test`.
#   macos   macos-latest, builds the CLI with Apple clang and runs the three
#           deterministic test programs. Not `make test`: see the job.
#   msvc    windows-latest, compiles the three core .cc files z80cpmw pulls
#           straight out of src/ with cl. Compile only, nothing is run.
#
# What the last two are for: the core in src/ is compiled in place by three
# downstream ports - z80cpmw with MSVC, ioscpm with Apple clang, cpmdroid with
# the NDK - and until now a change here that broke any of those compilers was
# found by that port's own CI, days later and in somebody else's tree. Neither
# job was executed from the machine that wrote it; there is no Windows and no
# Mac here. They are written to be as small as they can be for that reason.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # setup-python rather than the runner's system interpreter: ubuntu-latest
      # is 24.04+, whose Python carries a PEP 668 EXTERNALLY-MANAGED marker, and
      # `pip install` into it fails outright with
      # "error: externally-managed-environment".
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          # cpmtools: cpmls/cpmcp/cpmrm, for disks/verify_disk_utils.sh.
          sudo apt-get install -y build-essential cpmtools
          # um80/ul80: the MACRO-80 toolchain src/r8.asm and src/w8.asm are
          # written for. Pinned for the reason CPMEMU_REF is pinned below - an
          # unpinned toolchain assembles a different binary without anyone
          # touching this repository, and the disk check compares bytes.
          pip install "um80==${UM80_VERSION}"
        env:
          UM80_VERSION: 0.3.43

      - name: Check the tools the disk check needs are really present
        run: |
          # verify_disk_utils.sh exits 0 when these are missing. That is
          # deliberate - they are not build dependencies - but here it would
          # turn a missing package into a passing job, so fail early instead.
          for t in um80 ul80 cpmls cpmcp cpmrm; do
            command -v "$t" >/dev/null || { echo "missing: $t"; exit 1; }
          done
          um80 --version || true

      - name: Build qkz80 library
        run: |
          # Cloned and pinned exactly as release.yml does it, into the same
          # place, so the tests and the released binary contain the same CPU
          # core. qkz80 is compiled straight out of a sibling checkout by this
          # repo and by three downstream ports with no version gate, so an
          # unpinned clone would test whatever cpmemu looked like this morning.
          git clone https://github.com/avwohl/cpmemu.git
          cd cpmemu
          git checkout --detach ${CPMEMU_REF}
          cd src
          make libqkz80.a
        env:
          CPMEMU_REF: 9a94e8d

      - name: Build and test
        run: |
          # Point at the clone explicitly rather than relying on src/makefile's
          # sister-directory fallback, which looks one level further up than
          # this clone sits and would fall through to /usr/local silently.
          make -C src \
            QKZ80_CFLAGS="-I$PWD/cpmemu/src" \
            QKZ80_LIBS="-L$PWD/cpmemu/src -lqkz80" \
            test 2>&1 | tee /tmp/test.log
          # GitHub runs `shell: bash` with -eo pipefail, so the pipeline above
          # already fails the step when make does. This is the belt: it is the
          # correct guard if `shell:` is ever dropped, when a bare `| tee` would
          # otherwise report tee's status and hide a failing suite.
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash

      - name: Assert the disk check actually opened the images
        run: |
          # verify_disk_utils.sh exits 0 when its tools are missing, so a
          # dropped package would silently stop comparing the R8/W8 inside
          # disks/*.img against src/r8.asm and src/w8.asm - the exact drift it
          # exists to catch. Insist on the line it prints only when it ran.
          if grep -qE '^SKIP: (um80|ul80|cpmcp) is not on PATH' /tmp/test.log; then
            echo "the disk check skipped for want of its tools:"
            grep '^SKIP:' /tmp/test.log
            exit 1
          fi
          if grep -q '^SKIP  web JS tests' /tmp/test.log; then
            echo "the web JS tests skipped - node should be present on this runner"
            exit 1
          fi
          # Insist on the COUNT, not just on a pass. Two tracked images times
          # two utilities is four; anything less means a copy went missing from
          # an image, which is the drift this whole check exists for and used to
          # be reported as an info line. Bump this if disks/verify_disk_utils.sh
          # gains an image.
          grep -qE '^PASS: 4 disk-resident binaries' /tmp/test.log || {
            echo "expected all 4 disk-resident binaries to be compared; got:"
            grep -E '^(PASS|FAIL|SKIP)' /tmp/test.log || true
            exit 1
          }

  # Apple clang, which is what ioscpm compiles this same core with. Deliberately
  # NOT `make -C src test`, for one measured reason: tests/cli_console.cc's
  # "The reserved key is consumed once, on a tty" case fails for the machine
  # rather than for the code - 12 passes out of 12 in one hour and 6 failures
  # out of 6 in the next on the same binary, A/B'd against a reverted
  # emu_io_cli.cc in the same minute and flaky both ways, so it is the pty round
  # trip in run_on_pty and not the code under test. It is in todo.txt for that.
  # Every other test in the suite is deterministic, so this runs them by name
  # through the makefile's own targets rather than reimplementing the recipe.
  #
  # The disk check is left to the ubuntu job on purpose: it compares bytes
  # inside disk images and says nothing about the compiler, so running it twice
  # would only add a second way to go red.
  macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build qkz80 library
        run: |
          # Same clone and the same pin as the ubuntu job above and as
          # release.yml. Four copies of one SHA now - three here and one in
          # release.yml - which is not ideal; bump all four together.
          git clone https://github.com/avwohl/cpmemu.git
          cd cpmemu
          git checkout --detach ${CPMEMU_REF}
          cd src
          make libqkz80.a
        env:
          CPMEMU_REF: 9a94e8d

      - name: Build the CLI
        run: |
          make -C src \
            QKZ80_CFLAGS="-I$PWD/cpmemu/src" \
            QKZ80_LIBS="-L$PWD/cpmemu/src -lqkz80"

      - name: Run the deterministic tests
        run: |
          # src/makefile already knows how to build each of these, including
          # that openpty is in libc here and in libutil on Linux.
          make -C src \
            QKZ80_CFLAGS="-I$PWD/cpmemu/src" \
            QKZ80_LIBS="-L$PWD/cpmemu/src -lqkz80" \
            test_vda_keyboard test_hbios_hostname test_cli_hostfile
          status=0
          for t in test_vda_keyboard test_hbios_hostname test_cli_hostfile; do
            ./src/$t || status=1
            echo
          done
          exit $status
        shell: bash

  # The MSVC half. z80cpmw's z80cpmw.vcxproj compiles this repo's core straight
  # out of ..\romwbw_emu\src - emu_init.cc, hbios_cpu.cc and hbios_dispatch.cc,
  # plus the headers - so a change here that MSVC will not accept breaks that
  # build and nothing in this repository notices. src/emu_io.h already carries
  # an _MSC_VER branch (fseeko/ftello do not exist there) precisely because that
  # has happened.
  #
  # Compile only. There is no MSVC build of the emulator to link and no test
  # program that would run on Windows; the question this answers is "does the
  # shared core still compile with cl", which is the whole of what the port
  # depends on.
  #
  # No /WX. hbios_dispatch.cc emits six C4267 warnings at /W3 - a size_t loop
  # index promoting a uint16_t guest address, where truncating to sixteen bits
  # IS the Z80 64K wrap HBIOS wants - and z80cpmw suppresses them on its side.
  # Turning warnings into errors here would make this job red for something
  # deliberate. Flags and defines are copied from that .vcxproj so the two see
  # the same source.
  msvc:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check out the pinned cpmemu for qkz80's headers
        run: |
          # Headers only - nothing of cpmemu is compiled here. Same pin as the
          # other two jobs.
          git clone https://github.com/avwohl/cpmemu.git
          cd cpmemu
          git checkout --detach ${env:CPMEMU_REF}
        env:
          CPMEMU_REF: 9a94e8d

      - name: Compile the shared core with cl
        shell: cmd
        run: |
          rem vswhere sits at a fixed path on every GitHub Windows image, which
          rem the Visual Studio install directory does not - it moves with the
          rem image's VS edition and year, so it must not be hardcoded.
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          rem A parenthesised block, not `if ... & exit /b 1`: cmd binds the
          rem `&` outside the if, so the one-liner form exits 1 every time.
          if not defined VSDIR (
            echo could not locate a Visual Studio with the C++ tools
            exit /b 1
          )
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /c /EHsc /W3 /std:c++17 ^
             /D_CRT_SECURE_NO_WARNINGS /DQKZ80_NO_TRACE /DNDEBUG /D_WINDOWS ^
             /I cpmemu\src /I src ^
             src\emu_init.cc src\hbios_cpu.cc src\hbios_dispatch.cc || exit /b 1
