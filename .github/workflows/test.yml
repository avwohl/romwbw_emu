name: Tests

# Nothing but a person ran the test suite before this. .github/workflows held
# only release.yml, which builds and packages and has no test step, so a change
# that broke the console, the HBIOS dispatcher or the disk-resident utilities
# was caught only if whoever made it thought to type `make -C src test`.
#
# `make -C src test` needs no ROM, no disk image and no network. It runs:
#   tests/vda_keyboard.cc        HBIOS VDA keyboard behaviour
#   tests/hbios_hostname.cc      HBF_HOST_GETNAME and its buffer bound
#   tests/cli_console.cc         the console on a real pipe and a real pty
#   tests/cli_hostfile.cc        where W8 writes, and what it reports back
#   tests/web_reload_disks.js    page JS, driven headless by node
#   tests/web_console_output.js  page JS, driven headless by node
#   tests/web_manifest.js        the page's catalog-manifest -> <option> logic
#   tests/catalog_client_test.py tools/romwbw-get against a catalog it serves
#                                itself on 127.0.0.1
#   disks/verify_disk_utils.sh   src/r8.asm and src/w8.asm build, and w8 still
#                                carries the HBF_HOST_CAPS interlock
#   roms/verify_romwbw_pin.sh    the built binary's --version release list
#                                against ROMWBW_SUPPORTED_RELEASES, plus every
#                                artifact in the tree and in the fetch cache
#
# THE ARTIFACTS ARE NOT IN THIS REPOSITORY any more. Since v1.40 the ROMs and
# disk images are published by avwohl/romwbw_disks and fetched with
# tools/romwbw-get, so `make test` runs the whole suite against a tree with no
# .rom and no .img in it - which is what a user has. The catalog steps further
# down then fetch the real thing and re-run the two artifact checks against
# what was actually downloaded, which is a stronger question than the one two
# tracked images could answer.
#
# cpm_disk.py, out of the cpmemu clone this job already makes for qkz80, is
# what disks/verify_disk_utils.sh's image half reads images with. It SKIPS
# silently when um80, ul80 or cpm_disk.py are missing - which is right on a
# developer's machine and wrong here, where a skip would report a green disk
# check that never opened an image. The step after the suite asserts it ran.
#
# Three jobs, and only the first one runs the suite:
#
#   test    ubuntu-latest, the whole of `make -C src test`.
#   macos   macos-latest, builds the CLI with Apple clang and runs the four
#           compiled test programs. Not `make test`: see the job.
#   msvc    windows-latest, compiles the three core .cc files z80cpmw pulls
#           straight out of src/ with cl. Compile only, nothing is run.
#
# What the last two are for: the core in src/ is compiled in place by three
# downstream ports - z80cpmw with MSVC, ioscpm with Apple clang, cpmdroid with
# the NDK - and until now a change here that broke any of those compilers was
# found by that port's own CI, days later and in somebody else's tree. Both are
# written to be as small as they can be, and both have run: the macos job went
# red on its first push, on a real portability defect in tests/cli_hostfile.cc,
# and all three jobs are green since.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # setup-python rather than the runner's system interpreter: ubuntu-latest
      # is 24.04+, whose Python carries a PEP 668 EXTERNALLY-MANAGED marker, and
      # `pip install` into it fails outright with
      # "error: externally-managed-environment".
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          # No cpmtools.  disks/verify_disk_utils.sh reads images with
          # cpm_disk.py now, which is stdlib-only Python out of the cpmemu
          # checkout this job already makes for qkz80.
          sudo apt-get install -y build-essential
          # um80/ul80: the MACRO-80 toolchain src/r8.asm and src/w8.asm are
          # written for.  Unpinned, like everything else here - see "On
          # pinning" in release.yml.  Note what that accepts: disks/
          # verify_disk_utils.sh compares the r8.com/w8.com on each fetched
          # image against a fresh assembly BYTE FOR BYTE, so a um80 release
          # that changes its output turns this job red with nothing in this
          # repository touched.  That is the intended signal - it means the
          # PUBLISHED images no longer match these sources - and the fix is a
          # rebuild and re-publish in romwbw_disks, not a version pin here.
          pip install um80

      - name: Check the tools the disk check needs are really present
        run: |
          # verify_disk_utils.sh exits 0 when these are missing. That is
          # deliberate - they are not build dependencies - but here it would
          # turn a missing package into a passing job, so fail early instead.
          for t in um80 ul80; do
            command -v "$t" >/dev/null || { echo "missing: $t"; exit 1; }
          done
          um80 --version || true

      - name: Build qkz80 library
        run: |
          # Cloned exactly as release.yml does it, into the same place, so the
          # tests and the released binary contain the same CPU core.  Neither
          # pins a ref - see "On pinning" in release.yml - so both track
          # cpmemu's default branch, and this job is what makes that safe: it
          # runs on every push here, so a cpmemu change that breaks this
          # repository surfaces on the next commit rather than at tag time.
          git clone https://github.com/avwohl/cpmemu.git
          cd cpmemu/src
          make libqkz80.a

      - name: Check cpm_disk.py came with the cpmemu clone
        run: |
          # disks/verify_disk_utils.sh looks for $CPM_DISK, then a sister
          # checkout, then $GITHUB_WORKSPACE/cpmemu - which is where the step
          # above clones it.  It SKIPS the image half when it finds none, so
          # without this assertion a cpmemu layout change would quietly turn
          # the image half off and leave this job green.
          test -f cpmemu/util/cpm_disk.py || {
            echo "missing: cpmemu/util/cpm_disk.py"; exit 1; }
          python3 cpmemu/util/cpm_disk.py --help >/dev/null

      - name: Build and test
        run: |
          # Point at the clone explicitly rather than relying on src/makefile's
          # sister-directory fallback, which looks one level further up than
          # this clone sits and would fall through to /usr/local silently.
          make -C src \
            QKZ80_CFLAGS="-I$PWD/cpmemu/src" \
            QKZ80_LIBS="-L$PWD/cpmemu/src -lqkz80" \
            test 2>&1 | tee /tmp/test.log
          # GitHub runs `shell: bash` with -eo pipefail, so the pipeline above
          # already fails the step when make does. This is the belt: it is the
          # correct guard if `shell:` is ever dropped, when a bare `| tee` would
          # otherwise report tee's status and hide a failing suite.
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash

      - name: Assert the offline suite really ran
        run: |
          # Every one of these checks exits 0 when a tool it needs is missing.
          # That is deliberate - none of them is a build dependency - but here
          # a dropped package would turn "did not run" into a green job, which
          # is the failure mode this whole block exists for.
          if grep -qE '^SKIP: (um80|ul80) is not on PATH' /tmp/test.log; then
            echo "the disk-utility source gate skipped for want of its tools:"
            grep '^SKIP:' /tmp/test.log
            exit 1
          fi
          if grep -q '^SKIP  web JS tests' /tmp/test.log; then
            echo "the web JS tests skipped - node should be present on this runner"
            exit 1
          fi
          if grep -q '^SKIP  catalog client test' /tmp/test.log; then
            echo "the catalog client test skipped - python3 should be present"
            exit 1
          fi
          # The source gate is the half that needs no network and no image: it
          # assembles src/r8.asm and src/w8.asm and asserts that the w8.com
          # they build still contains the HBF_HOST_CAPS interlock bytes. It is
          # the only thing standing between an edit to w8.asm and a W8 that
          # hands a guest-supplied host path to a front end that promised
          # nothing about where it lands, so assert it happened.
          grep -qE '^PASS: src/r8.asm and src/w8.asm build, and w8 carries' /tmp/test.log || {
            echo "the r8/w8 source gate did not run, or did not pass; got:"
            grep -E '^(PASS|FAIL|SKIP)' /tmp/test.log || true
            exit 1
          }
          # And that the RomWBW release check ran at all. It went years without
          # being run by anything - not `make test`, not any job here - so the
          # thing worth asserting is not that it passed but that it happened.
          grep -qE '^PASS: (every artifact names a RomWBW release|src/romwbw_pin.h is consistent)' /tmp/test.log || {
            echo "roms/verify_romwbw_pin.sh did not run, or did not pass; got:"
            grep -E '^(PASS|FAIL|warn)' /tmp/test.log || true
            exit 1
          }
          # The binary's supported list is only checked when the binary exists.
          # `make test` does not build romwbw_emu, so a tree where it happens
          # not to be built reports "info not built" and the staleness check
          # silently does not happen - which is the same shape of gap.
          if grep -q 'info  not built' /tmp/test.log; then
            echo "romwbw_emu was not built, so its supported-release list was not checked"
            exit 1
          fi

      - name: Nothing binary has come back into the tree
        run: |
          # Requirement (a) of the v1.40 migration - "no ROM or disk images in
          # this repository" - is otherwise a policy git will not enforce, and
          # this tree's own history says what happens without one: four copies
          # of the same ROM drifted apart in September 2026 and nothing
          # noticed for a day.
          #
          # archive/ is named and excluded rather than being covered by a
          # pattern that happens to miss it, and the exception is now one file:
          # archive/cpm22/com/mbasic.com, third-party CP/M software with no
          # source in this tree and no upstream this project controls. The
          # other six binaries that used to sit under archive/ went on
          # 2026-09-07 - a stock RomWBW ROM recoverable from the upstream
          # package, a zero-byte disk image, an x86-64 build artifact and three
          # files cpm22asm/build_cpm.sh rebuilds - see archive/cpm22/README.md.
          # A carve-out that is spelled out is a different thing from one that
          # is an accident of a regex.
          found=$(git ls-files -- ':!archive/**' \
                    | grep -Ei '\.(rom|img)$' || true)
          if [ -n "$found" ]; then
            echo "ROM or disk images are tracked again outside archive/:"
            echo "$found"
            echo
            echo "They belong in avwohl/romwbw_disks, fetched with"
            echo "tools/romwbw-get. See docs/CATALOG.md."
            exit 1
          fi
          echo "no .rom or .img tracked outside archive/ - as intended since v1.40"

      # --- the live catalog ----------------------------------------------------
      #
      # Everything above is offline. These steps ask the questions only the real
      # catalog can answer, and they are TRI-STATE, the way
      # tools/check-store-version.sh already is:
      #
      #   exit 0  fetched and verified            -> green
      #   exit 2  could not reach github.com      -> warning, still green
      #   exit 1  a hash, size or schema is wrong -> RED
      #
      # A gate that cries wolf is a gate that stops being read, and a GitHub
      # outage is not a defect in this repository.
      - name: Fetch the published ROM and disk
        id: fetch
        run: |
          set +e
          tools/romwbw-get versions
          tools/romwbw-get fetch @rom @disk0
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) echo "fetched and verified against the published sha256" ;;
            2) echo "::warning::the romwbw_disks catalog was unreachable, so the catalog checks below did NOT run"
               echo "CATALOG NOT VERIFIED - github.com unreachable" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::the catalog contradicted itself - see above"; exit 1 ;;
          esac

      - name: Check what was downloaded, not what a table says
        if: steps.fetch.outputs.rc == '0'
        run: |
          # The counts are COMPUTED from what the fetch step just produced, not
          # typed. This job used to assert the literal strings "PASS: 4
          # disk-resident binaries" and "PASS: 2 shipped w8.com carry", which
          # were two tracked images times two utilities - a number a human had
          # to bump, in a repository whose whole premise is now that the set of
          # images changes without anyone here touching anything.
          cache=$(tools/romwbw-get cache-dir)
          imgs=$(find "$cache" -name '*.img' | wc -l | tr -d ' ')
          test "$imgs" -ge 1 || { echo "the fetch produced no image"; exit 1; }
          sh disks/verify_disk_utils.sh "$cache" 2>&1 | tee /tmp/disk.log
          grep -qE "^PASS: $imgs image\(s\) inspected" /tmp/disk.log || {
            echo "expected all $imgs fetched image(s) to be inspected; got:"
            grep -E '^(PASS|FAIL|  skip)' /tmp/disk.log || true
            exit 1
          }
          # The combo image is the one the catalog flags host_transfer, so at
          # least one r8/w8 comparison must have really happened. A run that
          # opened images and compared nothing is the same silent-scope failure
          # in a new place.
          grep -qE '^PASS: [0-9]+ image\(s\) inspected, [1-9][0-9]* disk-resident' /tmp/disk.log || {
            echo "images were opened but no r8/w8 copy was compared:"
            cat /tmp/disk.log
            exit 1
          }
          sh roms/verify_romwbw_pin.sh 2>&1 | tee /tmp/pin.log
          grep -qE '^PASS: every artifact names a RomWBW release' /tmp/pin.log || {
            echo "the fetched artifacts did not pass the release check:"
            cat /tmp/pin.log
            exit 1
          }

      - name: Boot the published ROM
        if: steps.fetch.outputs.rc == '0'
        run: |
          # The end of the whole chain: the artifacts this repository tells
          # users to download must actually boot in the binary it builds. A
          # hash that matches a catalog is not evidence of that.
          set -o pipefail
          printf '\n\n' | timeout 120 tools/romwbw-get run -- \
              --boot=2 --escape=none 2>&1 | tee /tmp/boot.log || true
          grep -q 'CBIOS v' /tmp/boot.log || {
            echo "the fetched ROM and disk did not reach a CBIOS banner:"
            cat /tmp/boot.log
            exit 1
          }
          grep -q 'CP/M-80' /tmp/boot.log || {
            echo "booted, but never reached the CP/M prompt:"
            cat /tmp/boot.log
            exit 1
          }
          # A matched pair must NOT warn. This is the check that the ROM and
          # the disk the catalog offers together really do go together.
          if grep -q 'HBIOS/CBIOS Version Mismatch' /tmp/boot.log; then
            echo "the catalog's own ROM and disk are a mismatched pair:"
            cat /tmp/boot.log
            exit 1
          fi
          echo "booted the published pair to a CP/M prompt with no mismatch"

  # Apple clang, which is what ioscpm compiles this same core with. This runs the
  # four compiled test programs by name through the makefile's own targets rather
  # than reimplementing the recipe; it is not `make -C src test`, which would
  # also run the node and disk checks the ubuntu job already runs.
  #
  # tests/cli_console.cc was left out of that list once, as flaky on a Mac. It is
  # not, and the pty round trip was never the reason - the file's own comment on
  # run_on_pty() said so in the same tree. "The reserved key is consumed once, on
  # a tty" asserted what the console does with an EMPTY terminal from inside the
  # case body, which runs AFTER the handshake that tells the parent it may type,
  # so the parent's ^E could already be sitting in the pty: about one run in
  # twenty. run_on_pty()'s `before_input` hook moves that assertion in front of
  # the handshake and the case is deterministic again. Re-measured after the fix
  # on macOS 27 arm64 with Apple clang 21: 400 consecutive runs, 0 failures.
  #
  # The disk check is left to the ubuntu job on purpose: it compares bytes
  # inside disk images and says nothing about the compiler, so running it twice
  # would only add a second way to go red.
  macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build qkz80 library
        run: |
          # Same clone as the ubuntu job above and as release.yml, and like
          # them it tracks cpmemu's default branch rather than a ref.
          git clone https://github.com/avwohl/cpmemu.git
          cd cpmemu/src
          make libqkz80.a

      - name: Build the CLI
        run: |
          make -C src \
            QKZ80_CFLAGS="-I$PWD/cpmemu/src" \
            QKZ80_LIBS="-L$PWD/cpmemu/src -lqkz80"

      - name: Run the deterministic tests
        run: |
          # src/makefile already knows how to build each of these, including
          # that openpty is in libc here and in libutil on Linux.
          make -C src \
            QKZ80_CFLAGS="-I$PWD/cpmemu/src" \
            QKZ80_LIBS="-L$PWD/cpmemu/src -lqkz80" \
            test_vda_keyboard test_hbios_hostname test_cli_console \
            test_cli_hostfile
          status=0
          for t in test_vda_keyboard test_hbios_hostname test_cli_console \
                   test_cli_hostfile; do
            ./src/$t || status=1
            echo
          done
          exit $status
        shell: bash

  # The MSVC half. z80cpmw's z80cpmw.vcxproj compiles this repo's core straight
  # out of ..\romwbw_emu\src - emu_init.cc, hbios_cpu.cc and hbios_dispatch.cc,
  # plus the headers - so a change here that MSVC will not accept breaks that
  # build and nothing in this repository notices. src/emu_io.h already carries
  # an _MSC_VER branch (fseeko/ftello do not exist there) precisely because that
  # has happened.
  #
  # Compile only. There is no MSVC build of the emulator to link and no test
  # program that would run on Windows; the question this answers is "does the
  # shared core still compile with cl", which is the whole of what the port
  # depends on.
  #
  # hbios_dispatch.cc used to emit six C4267 warnings at /W3 - a size_t loop
  # index promoting a uint16_t guest address, where truncating to sixteen bits
  # IS the Z80 64K wrap HBIOS wants. Each of the six now carries an explicit
  # (uint16_t) cast that says so, and src/makefile turns on Clang's name for
  # the same diagnostic (-Wimplicit-int-conversion) so they cannot come back
  # unnoticed; z80cpmw's own /wd4267 on this file is now removable. Not
  # re-measured with cl - there is still no Windows here - so the count above
  # is what the Clang equivalent reported, not what this job will print.
  #
  # No /WX all the same. cl at /W3 compiles the qkz80 headers along with these
  # files, and this job exists to answer "does the shared core still compile
  # with cl", not to make a dependency's warnings red. Flags and defines are
  # copied from that .vcxproj so the two see the same source.
  msvc:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check out cpmemu for qkz80's headers
        run: |
          # Headers only - nothing of cpmemu is compiled here. Same unpinned
          # clone as the other two jobs.
          git clone https://github.com/avwohl/cpmemu.git

      - name: Compile the shared core with cl
        shell: cmd
        run: |
          rem vswhere sits at a fixed path on every GitHub Windows image, which
          rem the Visual Studio install directory does not - it moves with the
          rem image's VS edition and year, so it must not be hardcoded.
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          rem A parenthesised block, not `if ... & exit /b 1`: cmd binds the
          rem `&` outside the if, so the one-liner form exits 1 every time.
          if not defined VSDIR (
            echo could not locate a Visual Studio with the C++ tools
            exit /b 1
          )
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /c /EHsc /W3 /std:c++17 ^
             /D_CRT_SECURE_NO_WARNINGS /DQKZ80_NO_TRACE /DNDEBUG /D_WINDOWS ^
             /I cpmemu\src /I src ^
             src\emu_init.cc src\hbios_cpu.cc src\hbios_dispatch.cc || exit /b 1
